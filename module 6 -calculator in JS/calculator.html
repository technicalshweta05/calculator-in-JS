<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #e5e5e5;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.calculator {
    background: #1f1f1f;
    padding: 20px;
    border-radius: 15px;
    width: 260px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.display {
    background: #111;
    color: #fff;
    font-size: 28px;
    text-align: right;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 15px;
    min-height: 50px;
    word-wrap: break-word;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 50px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    color: #fff;
    background: #333;
    cursor: pointer;
}

.clear { background: #e63946; }
.operator { background: #ff8c00; }
.equal {
    background: #28a745;
    grid-column: span 4;
    height: 55px;
    font-size: 18px;
}
.gray { background: #444; }
</style>

</head>
<body>

<div class="calculator">
    <div class="display" id="display"></div>

    <div class="buttons">
        <button class="clear">C</button>
        <button class="gray">⌫</button>
        <button class="gray">(</button>
        <button class="gray">)</button>

        <button class="operator">/</button>
        <button>7</button>
        <button>8</button>
        <button>9</button>

        <button class="operator">*</button>
        <button>4</button>
        <button>5</button>
        <button>6</button>

        <button class="operator">-</button>
        <button>1</button>
        <button>2</button>
        <button>3</button>

        <button class="operator">+</button>
        <button>0</button>
        <button>.</button>
        <button></button>

        <button class="equal">=</button>
    </div>
</div>

<script>
let display = document.getElementById("display");
let buttons = document.querySelectorAll("button");

let expression = "";

buttons.forEach(button => {
    button.addEventListener("click", () => {
        let value = button.innerText;

        if (value === "C") {
            expression = "";
            display.innerText = "";
        }
        else if (value === "⌫") {
            expression = expression.slice(0, -1);
            display.innerText = expression;
        }
        else if (value === "=") {
            try {
                expression = eval(expression).toString();
                display.innerText = expression;
            } catch {
                display.innerText = "Error";
                expression = "";
            }
        }
        else {
            expression += value;
            display.innerText = expression;
        }
    });
});
</script>

</body>
</html>
